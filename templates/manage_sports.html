{% extends "layout.html" %}
{% block title %}Manage Sports - Admin Panel{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Manage Sports</h1>
    <div class="row">
        <div class="col-md-6">
            <h2 id="form-title">Add Sport</h2>
            <form action="{{ url_for('admin.manage_sports') }}" method="POST" id="sportForm">
                <input type="hidden" id="sport_id" name="sport_id">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <button type="submit" name="submit" class="btn btn-primary" id="add-button">Add Sport</button>
                <button type="button" class="btn btn-secondary" id="cancel-button" style="display: none;" onclick="resetForm()">Cancel</button>
            </form>
        </div>
        <div class="col-md-6">
            <h2>Existing Sports</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    {% for sport in sports %}
                    <tr>
                        <td>{{ sport[0] }}</td>
                        <td>{{ sport[1] }}</td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="editSport('{{ sport[0] }}', '{{ sport[1] }}')">
                                <i class="fa fa-pencil-alt"></i>
                            </button>
                        </td>
                        <td>
                            <button class="btn btn-danger btn-sm" data-toggle="modal" data-target="#deleteModal" data-id="{{ sport[0] }}" data-action="{{ url_for('admin.manage_sports') }}">
                                <i class="fa fa-minus"></i>
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Include the delete modal -->
{% include 'delete_modal.html' %}

<script>
    function editSport(id, name) {
        document.getElementById('sport_id').value = id;
        document.getElementById('name').value = name;
        document.getElementById('form-title').innerText = 'Edit Sport';
        document.getElementById('add-button').innerText = 'Update Sport';
    }
    
    function resetForm() {
        document.getElementById('sportForm').reset();
        document.getElementById('sport_id').value = '';
        document.getElementById('form-title').innerText = 'Add Sport';
        document.getElementById('add-button').innerText = 'Add Sport';
    }

    $('#deleteModal').on('show.bs.modal', function (event) {
        var button = $(event.relatedTarget);
        var id = button.data('id');
        var action = button.data('action');
        document.getElementById('deleteItemId').value = id;
        document.getElementById('deleteForm').action = action;
    });
</script>
{% endblock %}
